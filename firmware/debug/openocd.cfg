source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 100
# Keep SWD slow and do not let OpenOCD install its temporary HSI PLL.
# SystemClock_Config owns the application HSE/PLL and OverDrive setup.
stm32f4x.cpu configure -event reset-start { adapter speed 100 }
stm32f4x.cpu configure -event reset-init { adapter speed 100 }
